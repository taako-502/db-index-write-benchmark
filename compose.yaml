services:
  mongodb:
    image: mongo:8.0.16
    ports:
      - "127.0.0.1:27018:27017"
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    cpus: 2
    mem_limit: 3g
    volumes:
      - benchmark-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
  postgresql:
    image: postgres:17.6
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: benchmark
    ports:
      - "127.0.0.1:5433:5432"
    command: ["postgres", "-c", "shared_buffers=1GB"]
    cpus: 2
    mem_limit: 3g
    volumes:
      - postgres-benchmark-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-benchmark-data:
  benchmark-data:
